<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleatz</title><style>html,body{background:#080808;color:#f2f2f2}body{font-family:sans-serif}#status{margin:24px}</style></head>
<body><p id="status" role="alert" hidden></p>
<script>
(async()=>{
  const root=new URL('../',location.href);
  try {
    const response=await fetch(new URL('index.html',root),{cache:'no-cache'});
    if(!response.ok) throw new Error('Page unavailable');
    const html=await response.text();
    history.replaceState(null,'',location.pathname.replace(/\/$/,'')+location.search+location.hash);
    document.open();
    document.write(html.replace('<head>','<head><base href="'+root.href+'">'));
    document.close();
  } catch(error) {
    document.getElementById('status').hidden=false;
    document.getElementById('status').textContent='ページを読み込めませんでした。再読み込みしてください。';
  }
})();
</script></body></html>
