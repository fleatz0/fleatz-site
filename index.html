  .site-footer { padding-top:32px; }.work-grid { grid-template-columns:1fr; row-gap:48px; }
  .list-page { padding-top:48px; }.list-page h1 { margin-bottom:48px; }
  .detail-media { padding-top:40px; padding-bottom:40px; }
}
</style>
</head>
<body>
<header class="site-header"><nav class="nav" aria-label="メイン"><a class="brand" href="?" aria-label="Home"><img src="images/ui/logo.png" width="42" height="38" alt=""></a><div class="desktop-nav"><a href="?" data-page="home">Home</a><a href="?page=works" data-page="works">Works</a></div><button class="menu-toggle" id="menuOpen" aria-label="メニューを開く" aria-haspopup="dialog" aria-controls="mobileMenu" aria-expanded="false"><svg class="menu-symbol" aria-hidden="true" focusable="false" preserveAspectRatio="none" overflow="visible" style="display: block;" width="22.75" height="18" viewBox="0 0 22.75 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<g>
<path class="menu-line menu-line-top" d="M1 1H21.75" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path class="menu-line menu-line-middle" d="M1 9H21.75" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path class="menu-line menu-line-bottom" d="M1 17H21.75" stroke="white" stroke-width="2" stroke-linecap="round"/>
</g>
</svg></button></nav></header>
<main id="main"></main>
<footer class="site-footer"><div class="wrap" id="footerContent"></div></footer>
<dialog class="mobile-menu" id="mobileMenu" aria-label="メインメニュー"><div class="menu-header"><a class="brand" href="?" aria-label="Home"><img src="images/ui/logo.png" alt="" width="28" height="26"></a><button class="menu-toggle" id="menuClose" aria-label="メニューを閉じる"><svg class="menu-symbol" aria-hidden="true" focusable="false" preserveAspectRatio="none" overflow="visible" style="display: block;" width="22.75" height="18" viewBox="0 0 22.75 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<g>
<path class="menu-line menu-line-top" d="M1 1H21.75" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path class="menu-line menu-line-middle" d="M1 9H21.75" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path class="menu-line menu-line-bottom" d="M1 17H21.75" stroke="white" stroke-width="2" stroke-linecap="round"/>
</g>
</svg></button></div><div class="menu-body"><nav class="menu-links" aria-label="モバイル"><a href="?" data-page="home">Home</a><a href="?page=works" data-page="works">Works</a></nav><div class="menu-footer" id="menuFooter"></div></div></dialog>
<dialog class="lightbox" id="lightbox" aria-label="作品の拡大表示"><button class="lb-close" id="lbClose" aria-label="拡大表示を閉じる"><span class="lb-close-icon" aria-hidden="true"><img class="lb-close-light" src="images/ui/lightbox-close-light.svg" alt="" width="10" height="10"><img class="lb-close-dark" src="images/ui/lightbox-close-dark.svg" alt="" width="10" height="10"></span><span>Close</span></button><img id="lbImage" alt=""></dialog>
<noscript>作品の表示にはJavaScriptを有効にしてください。</noscript>
<script src="works.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const url = value => { const s=String(value || ''); return /^(https?:|mailto:)/i.test(s) || (!/^[a-z][a-z\d+.-]*:/i.test(s) && !s.startsWith('//')) ? s : ''; };
  const href = value => {const s=String(value||'');return url(!/^(https?:|mailto:)/i.test(s)&&s.includes('@') ? `mailto:${s}`:s);};
  const links = () => PROFILE.links.filter(l=>l.url).map(l=>`<a href="${esc(href(l.url))}"${/^https?:/i.test(href(l.url))?' target="_blank" rel="noopener"':''}>${esc(l.label)}</a>`).join('');
  const footer = () => `<div class="footer-links">${links()}</div><p class="copyright">© ${esc(PROFILE.name.toLowerCase())}</p>`;
  $('footerContent').innerHTML=footer(); $('menuFooter').innerHTML=footer();
  // idは並べ替えても変わらないURL用の識別子。既存データは動画ID/画像パスでも動く。
  // 元データは変更せず、年の新しい順に表示。同年は記入順、年未記入は末尾。
  const workYear = w => /^\d{4}$/.test(String(w.year ?? '').trim()) ? Number(w.year) : -Infinity;
  const sortedWorks = WORKS.map((work,index) => ({work,index})).sort((a,b) => {
    const ay=workYear(a.work), by=workYear(b.work);
    return ay===by ? a.index-b.index : (ay>by ? -1 : 1);
  }).map(entry => entry.work);
  const key = w => w.id || w.youtubeId || w.image || w.title;
  const workURL = w => `?work=${encodeURIComponent(key(w))}`;
  const thumbnail = (w,lazy=true) => {
    const src=w.youtubeId?`https://i.ytimg.com/vi/${encodeURIComponent(w.youtubeId)}/maxresdefault.jpg`:url(w.image);
    return src?`<img class="media-thumb" src="${esc(src)}" alt="" ${lazy?'loading="lazy"':''} ${w.youtubeId?`data-youtube="${esc(w.youtubeId)}"`:''}>`:'<span class="empty-media">COMING SOON</span>';
  };
  const card = w => `<a class="work-card" href="${esc(workURL(w))}"><div class="card-media${!w.youtubeId?' still':''}">${thumbnail(w)}</div><h3>${esc(w.title)}</h3>${w.year?`<p class="work-year">${esc(w.year)}</p>`:''}</a>`;
  const media = (w,lazy=true) => `<div class="media${!w.youtubeId?' still':''}">${thumbnail(w,lazy)}${w.youtubeId?`<button type="button" class="media-action" data-video="${esc(w.youtubeId)}" aria-label="${esc(w.title)} を再生"><span class="media-label media-play-label" aria-hidden="true"><span class="media-play-icon"><img class="media-play-icon-light" src="images/ui/play-light.svg" alt=""><img class="media-play-icon-dark" src="images/ui/play.svg" alt=""></span><span>Play</span></span></button>`:w.image?`<a class="media-action" href="${esc(url(w.image))}" data-enlarge aria-label="${esc(w.title)} を拡大表示"><span class="media-label media-view-label" aria-hidden="true"><span class="media-view-icon"><img class="media-view-icon-light" src="images/ui/view-light.svg" alt=""><img class="media-view-icon-dark" src="images/ui/view.svg" alt=""></span><span>View</span></span></a>`:''}</div>`;
  const params=new URLSearchParams(location.search), selected=params.get('work');
  const isList=params.get('page')==='works';
  document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===((selected!==null||isList)?'works':'home'))a.setAttribute('aria-current','page');});
  if(selected!==null){
    const w=WORKS.find(w=>key(w)===selected);
    if(w){
      document.title=`${w.title} — ${PROFILE.name}`;
      $('main').classList.add('framed-page','detail-page');
      const paragraphs=Array.isArray(w.overview)?w.overview:(w.overview?[w.overview]:(w.note?[w.note]:[]));
      const gallery=(w.gallery||[]).filter(g=>typeof g==='string'||g.image||g.youtubeId);
      $('main').innerHTML=`<article class="wrap"><header class="detail-heading"><h1>${esc(w.title)}</h1>${w.year?`<p class="work-year">${esc(w.year)}</p>`:''}</header><div class="detail-media">${media(w,false)}</div>${paragraphs.length?`<div class="overview prose">${paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`:''}${gallery.length?`<div class="gallery">${gallery.map(g=>media(typeof g==='string'?{image:g,title:w.title}:{...g,title:g.title||w.title})).join('')}</div>`:''}</article>`;
    }else{$('main').innerHTML='<div class="wrap list-page"><h1>作品が見つかりません</h1><a href="?page=works">Worksへ戻る</a></div>';}
  }else if(isList){
    $('main').classList.add('framed-page');
    document.title=`Works — ${PROFILE.name}`;
    const categories = [...new Set([...WORK_CATEGORIES, ...WORKS.map(w => w.category || '')])];
    const groups = categories.map((category, i) => {
      const items = sortedWorks.filter(w => (w.category || '') === category);
      if (!items.length) return '';
      const label = WORK_CATEGORY_LABELS[category] || category || WORK_CATEGORY_LABELS.other;
      return `<section class="work-category" aria-labelledby="category-${i}"><h2 id="category-${i}">${esc(label)}</h2><div class="work-grid">${items.map(card).join('')}</div></section>`;
    }).join('');
    $('main').innerHTML=`<section class="wrap list-page"><h1>Works</h1>${groups}</section>`;
  }else{
    const reel=PROFILE.showreel;
    const hero=PROFILE.hero;
    $('main').classList.add('home-page');
    const heroHTML=hero ? '<section class="hero" aria-label="'+esc(hero.title)+'"><picture><source media="(max-width:760px)" srcset="'+esc(url(hero.mobile))+'" width="390" height="211"><img src="'+esc(url(hero.desktop))+'" width="1440" height="178" alt="'+esc(hero.title)+'" fetchpriority="high"></picture></section>' : '';
    const contactLinks=(PROFILE.commission.linkLabels||[]).map(label=>PROFILE.links.find(l=>l.label===label)).filter(l=>l&&l.url).map(l=>'<a class="view-all" href="'+esc(href(l.url))+'"'+(/^https?:/i.test(href(l.url))?' target="_blank" rel="noopener"':'')+'>'+esc(l.label)+'</a>').join('');
    $('main').innerHTML=`${heroHTML}${reel?`<section class="wrap showreel"><h1>${esc(reel.title)}</h1>${reel.youtubeId?`<div class="detail-media">${media({youtubeId:reel.youtubeId,title:reel.title},false)}</div>`:`<p class="showreel-status">${esc(reel.status)}</p>`}</section>`:''}<section class="home-works" aria-labelledby="worksHeading"><div class="wrap"><h2 id="worksHeading">Works</h2><div class="works-actions"><a class="view-all" href="?page=works">View All →</a></div></div><div class="works-carousel"><div class="scroll-controls" aria-label="作品の横スクロール"><button type="button" id="worksPrev" aria-label="前の作品" aria-controls="worksScroll"></button><button type="button" id="worksNext" aria-label="次の作品" aria-controls="worksScroll"></button></div><div id="worksScroll" class="works-scroll" tabindex="0" role="region" aria-label="作品一覧。左右にスクロールできます"><div class="works-track">${sortedWorks.filter(w=>w.featured===true).map(card).join('')}</div></div></div><input class="works-scrollbar" id="worksScrollbar" type="range" min="0" max="1000" value="0" step="1" aria-label="作品一覧のスクロール位置" aria-controls="worksScroll"></section><section class="wrap about"><h2>About</h2><div class="about-identity"><img src="images/ui/logo.png" width="42" height="38" alt=""><h3>${esc(PROFILE.name)}</h3></div><div class="prose">${PROFILE.bio.map(p=>`<p>${esc(p)}</p>`).join('')}</div>${PROFILE.bioEn?.length?`<div class="prose translation" lang="en">${PROFILE.bioEn.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`:''}</section><section class="wrap commissions"><h2>Commissions</h2><p class="commission-status">${esc(PROFILE.commissionsOpen?PROFILE.commission.openLabel:PROFILE.commission.closedLabel)}</p><div class="commission-details"><ul>${PROFILE.commission.accepts.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p>${esc(PROFILE.commission.note)}</p>${PROFILE.commission.acceptsEn?.length||PROFILE.commission.noteEn?`<div class="translation" lang="en"><ul>${(PROFILE.commission.acceptsEn||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${PROFILE.commission.noteEn?`<p>${esc(PROFILE.commission.noteEn)}</p>`:''}</div>`:''}<div class="commission-links">${contactLinks}</div></div></section>`;
  }
  const scroller=$('worksScroll');
  if(scroller){
    const prev=$('worksPrev'),next=$('worksNext'),bar=$('worksScrollbar');
    const update=()=>{
      const max=scroller.scrollWidth-scroller.clientWidth;
      prev.disabled=scroller.scrollLeft<=1;next.disabled=scroller.scrollLeft>=max-1;
      bar.disabled=max<=1;bar.value=max>0?Math.round(scroller.scrollLeft/max*1000):0;
      bar.setAttribute('aria-valuetext',Math.round(Number(bar.value)/10)+'%');
      bar.style.setProperty('--scroll-thumb-width',Math.max(24,bar.clientWidth*scroller.clientWidth/scroller.scrollWidth)+'px');
    };
    bar.addEventListener('input',()=>{scroller.scrollLeft=Number(bar.value)/1000*(scroller.scrollWidth-scroller.clientWidth);});
    bar.addEventListener('pointerdown',()=>{scroller.style.scrollSnapType='none';});
    const finishDrag=()=>{scroller.style.scrollSnapType='';update();};
    bar.addEventListener('change',finishDrag);bar.addEventListener('pointercancel',finishDrag);
    const move=direction=>{
      const card=scroller.querySelector('.work-card');
      if(!card) return;
      const step=card.getBoundingClientRect().width+(parseFloat(getComputedStyle(scroller.querySelector('.works-track')).gap)||0);
      scroller.scrollBy({left:direction*step,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});
    };
    prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
    scroller.addEventListener('scroll',update,{passive:true});
    new ResizeObserver(update).observe(scroller);
    update();
  }
  document.querySelectorAll('img[data-youtube]').forEach(img=>{
    const fallback=()=>{if(!img.dataset.fallback){img.dataset.fallback='1';img.src=`https://i.ytimg.com/vi/${encodeURIComponent(img.dataset.youtube)}/hqdefault.jpg`;}};
    img.addEventListener('error',fallback);img.addEventListener('load',()=>{if(img.naturalWidth<320)fallback();});
    if(img.complete && img.naturalWidth<320)fallback();
  });
  document.querySelectorAll('[data-video]').forEach(button=>button.addEventListener('click',()=>{
    const iframe=document.createElement('iframe'); iframe.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(button.dataset.video)}?autoplay=1`;iframe.title=button.getAttribute('aria-label');iframe.allow='autoplay; encrypted-media; picture-in-picture';iframe.allowFullscreen=true;button.parentElement.replaceChildren(iframe);iframe.focus();
  }));
  const menu=$('mobileMenu'),lb=$('lightbox');let opener=null;
  const reducedMotion=window.matchMedia('(prefers-reduced-motion:reduce)');
  let menuClosing=false, menuCloseTimer;
  const finishMenuClose=()=>{
    clearTimeout(menuCloseTimer);
    menuClosing=false;
    menu.classList.remove('is-visible');
    if(menu.open) menu.close();
  };
  const closeMenu=()=>{
    if(!menu.open || menuClosing) return;
    menuClosing=true;
    $('menuOpen').classList.add('is-closing');
    menu.classList.remove('is-visible');
    // ダイアログとフォーカス制御はフェードが完了するまで保持する。
    const duration=getComputedStyle(menu).transitionDuration.split(',').reduce((max,value)=>{
      const n=parseFloat(value)||0;
      return Math.max(max,value.trim().endsWith('ms')?n:n*1000);
    },0);
    if(reducedMotion.matches || !duration) finishMenuClose();
    else menuCloseTimer=setTimeout(finishMenuClose,duration+50);
  };
  $('menuOpen').addEventListener('click',()=>{
    if(menu.open) return;
    clearTimeout(menuCloseTimer);
    menuClosing=false;
    $('menuOpen').classList.remove('is-closing');
    menu.showModal();
    document.body.style.overflow='hidden';
    $('menuOpen').setAttribute('aria-expanded','true');
    // 閉じた状態を計算してから切り替え、初回もトランジションを発火させる。
    void menu.offsetWidth;
    menu.classList.add('is-visible');
    $('menuClose').focus();
  });
  $('menuClose').addEventListener('click',closeMenu);
  menu.addEventListener('cancel',e=>{e.preventDefault();closeMenu();});
  menu.addEventListener('transitionend',e=>{
    if(menuClosing && e.target===menu && e.propertyName==='opacity') finishMenuClose();
  });
  menu.addEventListener('close',()=>{
    clearTimeout(menuCloseTimer);
    menuClosing=false;
    menu.classList.remove('is-visible');
    document.body.style.overflow='';
    $('menuOpen').setAttribute('aria-expanded','false');
    $('menuOpen').classList.remove('is-closing');
    if(window.matchMedia('(max-width:760px)').matches) $('menuOpen').focus();
    else document.querySelector('.desktop-nav a[aria-current="page"]').focus();
  });
  reducedMotion.addEventListener('change',e=>{if(e.matches && menuClosing) finishMenuClose();});
  window.matchMedia('(max-width:760px)').addEventListener('change',e=>{if(!e.matches && menu.open) finishMenuClose();});
  document.querySelectorAll('[data-enlarge]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();opener=a;$('lbImage').src=a.href;$('lbImage').alt=a.getAttribute('aria-label');lb.showModal();document.body.style.overflow='hidden';$('lbClose').focus();}));
  $('lbClose').addEventListener('click',()=>lb.close());lb.addEventListener('click',e=>{if(e.target===lb)lb.close();});lb.addEventListener('close',()=>{document.body.style.overflow='';if(opener)opener.focus();});
})();
</script>
</body>
